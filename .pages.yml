            default: ""
      - name: seoTitle
        label: 搜索结果标题
        description: 选填；为空时网站使用产品名称。
        type: object
        fields:
          - name: en
            label: 搜索结果标题（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
