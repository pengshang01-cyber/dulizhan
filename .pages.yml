# Pages CMS 官方配置：https://pagescms.org/docs/configuration/
# 分类 reference 保存文件名（含 .json），产品 schema 统一转换为分类 id。
media:
  - name: products
    label: 产品图片
    input: src/assets/images/products
    output: ../../assets/images/products
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: categories
    label: 分类封面
    input: src/assets/images/categories
    output: ../../assets/images/categories
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: site
    label: 网站资料图片
    input: src/assets/images/site
    output: ../assets/images/site
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: blog
    label: 资讯文章图片
    input: src/assets/images/blog
    output: ../../assets/images/blog
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
content:
  - name: products
    label: 产品
    type: collection
    path: src/content/products
    format: json
    subfolders: false
    filename: "{fields.slug}.json"
    view:
      primary: title.en
      fields:
        - title.en
        - order
      sort:
        - order
        - title.en
      search:
        - title.en
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: 产品网址片段
        description: 必填；仅用小写英文字母、数字和单个连字符。保存后不要随意修改；文件名自动使用此值。
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          message: 例如 tulip-cup-example；不要填中文、空格或斜杠。
      - name: sku
        label: 产品型号
        description: 填写真实型号；示例占位型号使用 TODO-001 这样的形式。
        type: string
        required: true
      - name: category
        label: 所属分类
        description: 先在“分类”保存分类，再从这里选择；选项会自动更新，不需要改代码。
        type: reference
        required: true
        options:
          collection: categories
          value: "{name}"
          label: "{fields.label.en}"
          search: name,label.en,label.zh
      - name: title
        label: 产品名称
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 产品名称（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 产品名称（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: badge
        label: 角标文字
        description: 选填；只有工厂已确认时才填写，例如真实的销售标记。整组留空则不显示。
        type: object
        fields:
          - name: en
            label: 角标文字（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 角标文字（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: summary
        label: 产品简介
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 产品简介（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 产品简介（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: images
        label: 产品图片
        description: 上传或选择多张真实产品图片；至少一张，第一张用作封面。
        type: image
        required: true
        options:
          media: products
          multiple: true
          unique: true
      - name: material
        label: 材质
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 材质（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 材质（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: gsm
        label: 纸张克重（g/m²）
        description: 不写单位；可填正数、范围（例如 260–300）或多个选项（例如 24 / 31 / 40），未确认时填 TODO_ 占位。
        type: string
        required: true
        pattern:
          regex: ^(?:TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+)|\d+(?:\.\d+)?(?:\s*[–/-]\s*\d+(?:\.\d+)?)+)$
          message: 请填写正数、范围、多个克重选项或 TODO_ 占位值。
      - name: sizes
        label: 尺寸规格
        description: 至少填写一组；直径和高度单位为毫米。非圆形或纸片规格可填写双语规格说明。
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name.en}"
        required: true
        fields:
          - name: name
            label: 规格名称
            description: 有尺寸型号时填写原型号（例如 5039）。英文字段必填，中文留空时使用英文。
            type: object
            required: true
            fields:
              - name: en
                label: 规格名称（英文）
                description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
                type: string
                required: true
              - name: zh
                label: 规格名称（中文）
                description: 选填；中文留空时回退显示英文。
                type: string
                default: ""
          - name: baseDiameterMm
            label: 底部直径（mm）
            description: 圆形底径以正数填写；方形、纸片等可留空，在规格说明填长宽。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数字或 TODO_ 占位值。
          - name: heightMm
            label: 高度（mm）
            description: 已确认高度填正数，不写单位；无高度或未确认时可留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数字或 TODO_ 占位值。
          - name: topDiameterMm
            label: 顶部直径（mm，可选）
            description: 只填正数，不写单位；未确认时填写 TODO_ 开头的占位值。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数字或 TODO_ 占位值。
          - name: specification
            label: 规格说明
            description: 可选；用于底部、顶部的长宽、纸片尺寸或该规格克重。填写时先填英文。
            type: object
            fields:
              - name: en
                label: 规格说明（英文）
                description: 例如 Base 65×65 mm, top 85×85 mm, height 35 mm。
                type: string
              - name: zh
                label: 规格说明（中文）
                description: 例如底部 65×65 mm，顶部 85×85 mm，高度 35 mm。
                type: string
      - name: colors
        label: 颜色
        description: 可新增或删除；每项英文必填，中文选填；没有内容时可留空列表。
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en}"
        default: []
        fields:
          - name: en
            label: 颜色（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 颜色（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: patterns
        label: 图案
        description: 可新增或删除；每项英文必填，中文选填；没有内容时可留空列表。
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en}"
        default: []
        fields:
          - name: en
            label: 图案（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 图案（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: customizable
        label: 是否支持定制
        description: 按该产品实际情况选择；尚未确认时保留待确认选项。
        type: select
        required: true
        default: TODO_CUSTOMIZATION_OPTIONS
        options:
          values:
            - name: "true"
              label: 支持定制
            - name: "false"
              label: 不支持定制
            - name: TODO_CUSTOMIZATION_OPTIONS
              label: 待工厂确认
      - name: moq
        label: 最小起订量
        description: 如产品所有规格通用则可填写；留空时显示网站设置中的说明。仅单个规格适用时填在包装详情。
        type: object
        fields:
          - name: en
            label: 最小起订量（英文）
            description: 选填；当整组留空时使用网站默认说明。
            type: string
          - name: zh
            label: 最小起订量（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: packaging
        label: 包装方式
        description: 填写全产品通用的包装方式；仅适用于单个规格时填在包装详情。
        type: object
        fields:
          - name: en
            label: 包装方式（英文）
            description: 选填；不同规格有不同包装时可留空。
            type: string
          - name: zh
            label: 包装方式（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: cartonSpec
        label: 外箱规格
        description: 填写全产品通用的外箱规格；具体规格的外箱信息填在包装详情。
        type: object
        fields:
          - name: en
            label: 外箱规格（英文）
            description: 选填；没有确认的通用外箱规格时留空。
            type: string
          - name: zh
            label: 外箱规格（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: leadTime
        label: 生产交期
        description: 留空时显示网站设置中的生产交期。
        type: object
        fields:
          - name: en
            label: 生产交期（英文）
            description: 选填；未确认产品专用交期时留空。
            type: string
          - name: zh
            label: 生产交期（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: faqs
        label: 产品问答
        description: 可为空；新增问答时问题和回答的英文都必填。
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{q.en}"
        default: []
        fields:
          - name: q
            label: 问题
            description: 英文必填；中文选填，留空时中文页面使用英文。
            type: object
            required: true
            fields:
              - name: en
                label: 问题（英文）
                description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
                type: string
                required: true
              - name: zh
                label: 问题（中文）
                description: 选填；中文留空时回退显示英文。
                type: string
                default: ""
          - name: a
            label: 回答
            description: 英文必填；中文选填，留空时中文页面使用英文。
            type: object
            required: true
            fields:
              - name: en
                label: 回答（英文）
                description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
                type: text
                required: true
              - name: zh
                label: 回答（中文）
                description: 选填；中文留空时回退显示英文。
                type: text
                default: ""
      - name: customOptions
        label: 定制选项详情
        description: 选填的多行文字，不需要写代码或 Markdown；整组为空时隐藏该区块。
        type: object
        fields:
          - name: en
            label: 定制选项详情（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 定制选项详情（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: packagingDetails
        label: 包装详情
        description: 选填的多行文字；整组为空时隐藏该区块。
        type: object
        fields:
          - name: en
            label: 包装详情（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 包装详情（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: applications
        label: 适用场景
        description: 选填的多行文字；整组为空时隐藏该区块。
        type: object
        fields:
          - name: en
            label: 适用场景（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 适用场景（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: seoTitle
        label: 搜索结果标题
        description: 选填；为空时网站使用产品名称。
        type: object
        fields:
          - name: en
            label: 搜索结果标题（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 搜索结果标题（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: seoDescription
        label: 搜索结果简介
        description: 选填；为空时网站使用产品简介。
        type: object
        fields:
          - name: en
            label: 搜索结果简介（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 搜索结果简介（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: featured
        label: 精选产品
        description: 勾选后标记为精选；是否展示由对应页面决定。
        type: boolean
        default: false
      - &a1
        name: order
        label: 排序
        description: 填写整数；数字越小越靠前。
        type: number
        required: true
        default: 0
  - name: categories
    label: 分类
    type: collection
    path: src/content/categories
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    view:
      primary: label.en
      fields:
        - label.en
        - order
      sort:
        - order
        - label.en
      search:
        - label.en
      default:
        sort: order
        order: asc
    fields:
      - name: label
        label: 分类名称
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 分类名称（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 分类名称（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: summary
        label: 分类简介
        description: 用一句简短文字介绍分类；英文必填，中文选填。
        type: object
        required: true
        fields:
          - name: en
            label: 分类简介（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 分类简介（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: image
        label: 分类封面
        description: 从对应媒体目录上传或选择图片；缺少实拍时使用明确标注的占位图。
        type: image
        required: true
        options:
          media: categories
      - *a1
      - name: showOnHome
        label: 显示在首页
        description: 有产品且勾选后可进入首页分类区；首页最多显示六类。
        type: boolean
        default: true
  - name: blog
    label: 资讯文章
    type: collection
    path: src/content/blog
    format: json
    subfolders: false
    filename:
      template: "{primary}.json"
      field: create
    view:
      primary: title.en
      fields: [title.en, date, draft]
      sort: [date, title.en]
      search: [title.en, title.zh]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 文章标题
        description: 英文必填；中文选填。正文有中文时，未填的中文标题或简介回退英文。
        type: object
        required: true
        fields:
          - name: en
            label: 文章标题（英文）
            type: string
            required: true
          - name: zh
            label: 文章标题（中文）
            type: string
            default: ""
      - name: description
        label: 文章简介
        description: 英文必填；中文选填。正文有中文时，未填的中文标题或简介回退英文。
        type: object
        required: true
        fields:
          - name: en
            label: 文章简介（英文）
            type: text
            required: true
          - name: zh
            label: 文章简介（中文）
            type: text
            default: ""
      - name: date
        label: 发布日期
        description: 必填，格式 YYYY-MM-DD；列表按此日期从新到旧排序。关闭草稿后即发布，不是定时发布。
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期
        default: ""
        description: 选填，不能早于发布日期；没有修订时留空。
        type: date
        options:
          format: yyyy-MM-dd
      - name: cover
        label: 文章封面
        description: 上传经确认的图片，建议 1600 × 900；不要用示例 Placeholder 作为正式封面。
        type: image
        required: true
        options:
          media: blog
      - name: tags
        label: 文章标签
        description: 可添加多个标签，英文必填，中文选填；中文缺失时回退英文。
        type: object
        list: true
        default: []
        fields:
          - name: en
            label: 标签（英文）
            type: string
            required: true
          - name: zh
            label: 标签（中文）
            type: string
            default: ""
      - name: relatedProducts
        default: []
        label: 相关产品
        description: 可多选，文章底部显示产品卡片；删除产品前请先移除文章中的引用。
        type: reference
        options:
          collection: products
          multiple: true
          value: "{fields.slug}"
          label: "{fields.title.en} ({fields.sku})"
          search: title.en,title.zh,sku,slug
      - name: draft
        label: 草稿（不上线）
        description: 默认开启；核对图文和参数后再关闭。草稿不会生成页面，也不会进入列表或 sitemap。
        type: boolean
        default: true
        required: true
      - name: bodyEn
        label: 正文（英文）
        description: 必填。用二级、三级标题生成目录；可插入博客媒体库图片。具体数字须核实，未确认用 [TODO]。
        type: rich-text
