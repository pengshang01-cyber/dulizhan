# Pages CMS 官方配置：https://pagescms.org/docs/configuration/
# 分类 reference 保存文件名（含 .json），产品 schema 统一转换为分类 id。
media:
  - name: products
    label: 产品图片
    input: src/assets/images/products
    output: ../../assets/images/products
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: categories
    label: 分类封面
    input: src/assets/images/categories
    output: ../../assets/images/categories
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: site
    label: 网站资料图片
    input: src/assets/images/site
    output: ../assets/images/site
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: blog
    label: 资讯文章图片
    input: src/assets/images/blog
    output: ../../assets/images/blog
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe
content:
  - name: products
    label: 产品
    type: collection
    path: src/content/products
    format: json
    subfolders: false
    filename: "{fields.slug}.json"
    view:
      primary: title.en
      fields:
        - title.en
        - order
      sort:
        - order
        - title.en
      search:
        - title.en
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: 产品网址片段
        description: 必填；仅用小写英文字母、数字和单个连字符。保存后不要随意修改；文件名自动使用此值。
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          message: 例如 tulip-cup-example；不要填中文、空格或斜杠。
      - name: sku
        label: 产品型号
        description: 填写真实型号；示例占位型号使用 TODO-001 这样的形式。
        type: string
        required: true
      - name: category
        label: 所属分类
        description: 先在“分类”保存分类，再从这里选择；选项会自动更新，不需要改代码。
        type: reference
        required: true
        options:
          collection: categories
          value: "{name}"
          label: "{fields.label.en}"
          search: name,label.en,label.zh
      - name: title
        label: 产品名称
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 产品名称（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 产品名称（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: badge
        label: 角标文字
        description: 选填；只有工厂已确认时才填写，例如真实的销售标记。整组留空则不显示。
        type: object
        fields:
          - name: en
            label: 角标文字（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 角标文字（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: summary
        label: 产品简介
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 产品简介（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: text
            required: true
          - name: zh
            label: 产品简介（中文）
            description: 选填；中文留空时回退显示英文。
            type: text
            default: ""
      - name: images
        label: 产品图片
        description: 第一张用作封面，只使用实拍或核对过的产品图。尺寸对比图和验收通过的成品展示只放在后续位置。
        type: object
        list:
          min: 1
          max: 12
        required: true
        fields:
          - name: image
            label: 产品图片文件
            description: 建议 1200 × 1200 的 WebP；尺寸对比图用 1200 × 900。核对规格、杯型和颜色工艺。
            type: image
            required: true
            options:
              media: products
          - name: alt
            label: 图片说明
            description: 描述当前图片中的产品、视角或场景。修改图片时一起更新说明。
            type: object
            fields:
              - name: en
                label: 图片说明（英文）
                type: string
                required: true
              - name: zh
                label: 图片说明（中文）
                type: string
                default: ""
          - name: sizeComparison
            label: 尺寸对比图
            description: 仅在已核对刻度、参照物和规格的尺寸图打开。作为辅图放在产品图之后。
            type: boolean
          - name: technicalDrawing
            label: 三视图
            description: 仅用于核实过的技术图，放在实拍、尺寸对比和效果示意之后。
            type: boolean
          - name: scene
            label: 成品展示图类型
            description: 普通产品图及尺寸对比图留空。展示图须先按技能检查参照比例，再选择特写或陈列。
            type: select
            options:
              values:
                - name: closeup
                  label: 使用中特写
                - name: display
                  label: 商业陈列
      - name: material
        label: 材质
        description: 英文必填；中文选填，留空时中文页面使用英文。
        type: object
        required: true
        fields:
          - name: en
            label: 材质（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 材质（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: gsm
        label: 纸张克重（g/m²）
        description: 不写单位；可填正数、范围（例如 260–300）或多个选项（例如 24 / 31 / 40），未确认时填 TODO_ 占位。
        type: string
        required: true
        pattern:
          regex: ^(?:TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+)|\d+(?:\.\d+)?(?:\s*[–/-]\s*\d+(?:\.\d+)?)+)$
          message: 请填写正数、范围、多个克重选项或 TODO_ 占位值。
      - name: sizes
        label: 尺寸规格
        description: 至少一组。先选形状，再填对应尺寸。纸片与纸卷保留原单位，盖子和包装按规格单独填写。
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name.en}"
        required: true
        fields:
          - name: name
            label: 规格名称
            description: 有尺寸型号时填写原型号（例如 5039）。英文字段必填，中文留空时使用英文。
            type: object
            required: true
            fields:
              - name: en
                label: 规格名称（英文）
                description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
                type: string
                required: true
              - name: zh
                label: 规格名称（中文）
                description: 选填；中文留空时回退显示英文。
                type: string
                default: ""
          - &m11-shape
            name: shape
            label: 规格形状
            description: 选择这一规格的形状，按下方对应栏位填写确认的尺寸。
            type: select
            options:
              values:
                - name: round
                  label: 圆形
                - name: rectangular
                  label: 方形或长方形
                - name: sheet
                  label: 纸片、垫纸或底板
                - name: roll
                  label: 纸卷
                - name: shaped
                  label: 异形杯或盘
          - &m11-diameterMm
            name: diameterMm
            label: 直径（mm）
            description: 圆形平片、圆盖直径等。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-baseDiameterMm
            name: baseDiameterMm
            label: 底部直径（mm）
            description: 圆形杯底部直径。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-topDiameterMm
            name: topDiameterMm
            label: 口径（mm）
            description: 圆形杯的杯口直径。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-baseLengthMm
            name: baseLengthMm
            label: 底部长（mm）
            description: 方形、长方形杯盒的底部长。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-baseWidthMm
            name: baseWidthMm
            label: 底部宽（mm）
            description: 方形、长方形杯盒的底部宽。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-topLengthMm
            name: topLengthMm
            label: 顶部长（mm）
            description: 方形、长方形杯盒的顶部长。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-topWidthMm
            name: topWidthMm
            label: 顶部宽（mm）
            description: 方形、长方形杯盒的顶部宽。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-heightMm
            name: heightMm
            label: 高度（mm）
            description: 平片或没有高度时留空。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-length
            name: length
            label: 长／卷长
            description: 片材的长或纸卷长度，与长度单位配合填写。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-width
            name: width
            label: 宽／卷宽
            description: 片材或纸卷的宽，与宽度单位配合填写。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-lowHeightMm
            name: lowHeightMm
            label: 低边高度（mm）
            description: 郁金香、莲花等有高低边时填写。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-highHeightMm
            name: highHeightMm
            label: 高边高度（mm）
            description: 郁金香、火焰等有高低边时填写。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-topWideMm
            name: topWideMm
            label: 杯口宽处（mm）
            description: 花边杯等不规则杯口的宽处。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-topNarrowMm
            name: topNarrowMm
            label: 杯口窄处（mm）
            description: 花边杯等不规则杯口的窄处。 只填正数或留空。
            type: string
            pattern:
              regex: ^(?:|TODO_.+|(?=.*[1-9])(?:\d+(?:\.\d+)?|\.\d+))$
              message: 请填写大于 0 的数值，未确认可留空。
          - &m11-lengthUnit
            name: lengthUnit
            label: 长度单位
            description: 按资料原单位选择。
            type: select
            options:
              values: [mm, cm, m]
          - &m11-widthUnit
            name: widthUnit
            label: 宽度单位
            description: 按资料原单位选择。
            type: select
            options:
              values: [mm, cm, m]
          - &m11-sizeMaterial
            name: material
            label: 该规格材质
            description: 仅此规格适用时填写，英文必填。
            type: object
            fields:
              - name: en
                label: 该规格材质（英文）
                type: string
                required: true
              - name: zh
                label: 该规格材质（中文）
                type: string
          - &m11-sizePaperWeight
            name: paperWeight
            label: 该规格纸张克重（g/m²）
            description: 仅此规格适用时填写，不写单位，支持正数、范围或已确认的多个值。
            type: string
          - &m11-unitWeight
            name: unitWeight
            label: 单个重量
            description: 填数值并保留资料中的单位，例如 4.5 g。
            type: string
          - &m11-sizeNote
            name: specification
            label: 补充说明
            description: 只填无法用结构化尺寸表示的已确认信息，例如厚度范围。
            type: object
            fields:
              - name: en
                label: 补充说明（英文）
                type: string
                required: true
              - name: zh
                label: 补充说明（中文）
                type: string
          - &m11-packages
            name: packages
            label: 包装与装箱选项
            description: 同一规格有多种包装时逐个新增选项，填写对应的外箱信息。
            type: object
            list: true
            fields:
              - name: packaging
                label: 包装方式
                description: 填每包装数量及袋型，例如 50 只 / OPP 袋。
                type: object
                fields:
                  - name: en
                    label: 包装方式（英文）
                    type: string
                    required: true
                  - name: zh
                    label: 包装方式（中文）
                    type: string
              - name: cartonLoading
                label: 装箱方式
                description: 填每包数量及每箱包数，例如 50 只 × 60 条。
                type: object
                fields:
                  - name: en
                    label: 装箱方式（英文）
                    type: string
                    required: true
                  - name: zh
                    label: 装箱方式（中文）
                    type: string
              - name: packWeight
                label: 单包重量
                description: 有单位才填写，例如 183 g。
                type: string
              - name: packSize
                label: 单包尺寸
                description: 长 × 宽 × 高，保留资料原单位。
                type: string
              - name: cartonWeight
                label: 单件重量
                description: 有单位才填写，例如 7 kg。
                type: string
              - name: cartonSpec
                label: 外箱规格
                description: 填该包装选项对应的长 × 宽 × 高，带 cm，例如 52 × 40 × 44 cm。未确认时留空。
                type: string
          - name: hasLid
            label: 有配套盖子
            description: 只有工厂确认该规格有配套盖子时打开。
            type: boolean
          - name: lid
            label: 配套盖子规格
            description: 只填这一规格的盖子尺寸和包装，缺资料时留空。
            type: object
            fields:
              - *m11-shape
              - *m11-diameterMm
              - *m11-baseDiameterMm
              - *m11-topDiameterMm
              - *m11-baseLengthMm
              - *m11-baseWidthMm
              - *m11-topLengthMm
              - *m11-topWidthMm
              - *m11-heightMm
              - *m11-length
              - *m11-width
              - *m11-lowHeightMm
              - *m11-highHeightMm
              - *m11-topWideMm
              - *m11-topNarrowMm
              - *m11-lengthUnit
              - *m11-widthUnit
              - *m11-sizeMaterial
              - *m11-sizePaperWeight
              - *m11-unitWeight
              - *m11-sizeNote
              - *m11-packages
      - name: colors
        label: 颜色
        description: 可新增或删除；每项英文必填，中文选填；没有内容时可留空列表。
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en}"
        default: []
        fields:
          - name: en
            label: 颜色（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 颜色（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
          - name: swatch
            label: 色块
            description: 选填经核对的示意颜色，使用 6 位十六进制颜色码，例如 #c6a244。
            type: string
            pattern: "^#[0-9A-Fa-f]{6}$"
      - name: moreColorsOnRequest
        label: 显示更多花色可咨询
        description: 印花杯、机制杯可开启该提示，保留已确认的文字说明。
        type: boolean
      - name: patterns
        label: 图案
        description: 可新增或删除；每项英文必填，中文选填；没有内容时可留空列表。
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{en}"
        default: []
        fields:
          - name: en
            label: 图案（英文）
            description: 填写英文；未确认的资料使用 TODO_ 开头的占位值。
            type: string
            required: true
          - name: zh
            label: 图案（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: customizable
        label: 是否支持定制
        description: 按该产品实际情况选择；尚未确认时保留待确认选项。
        type: select
        required: true
        default: TODO_CUSTOMIZATION_OPTIONS
        options:
          values:
            - name: "true"
              label: 支持定制
            - name: "false"
              label: 不支持定制
            - name: TODO_CUSTOMIZATION_OPTIONS
              label: 待工厂确认
      - name: moq
        label: 最小起订量
        description: 如产品所有规格通用则可填写；留空时显示网站设置中的说明。仅单个规格适用时填在包装详情。
        type: object
        fields:
          - name: en
            label: 最小起订量（英文）
            description: 选填；当整组留空时使用网站默认说明。
            type: string
          - name: zh
            label: 最小起订量（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: packaging
        label: 包装方式
        description: 填写全产品通用的包装方式；仅适用于单个规格时填在包装详情。
        type: object
        fields:
          - name: en
            label: 包装方式（英文）
            description: 选填；不同规格有不同包装时可留空。
            type: string
          - name: zh
            label: 包装方式（中文）
            description: 选填；中文留空时回退显示英文。
            type: string
            default: ""
      - name: cartonSpec
        label: 外箱规格
        description: 以 cm 填写全产品通用的外箱规格。具体规格的外箱信息填在包装详情。
        type: object
        fields:
          - name: en
            label: 外箱规格（英文）
            description: 选填；没有确认的通用外箱规格时留空。
            type: string
          - name: zh
            label: 外箱规格（中文）
